name: tfsec
on:
  push:
    branches: [ "prod","staging","dev"]
  pull_request:
    branches: [ "prod","staging","dev"]
  schedule:
    - cron: '31 10 * * 1'
jobs:
  tfsec:
    name: Run tfsec
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .
